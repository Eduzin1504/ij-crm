# Publica no GHCR as imagens de produção buildadas a partir da main:
#
#   app  ← Dockerfile, estágio `runtime`
#   ops  ← Dockerfile, estágio `ops`     (serviço one-shot `migrate`)
#
# A produção (Coolify, compose.coolify.yml) NÃO usa estas imagens: o Coolify
# builda o Dockerfile no próprio servidor a cada Redeploy (docs/coolify.md).
# Elas servem à instalação standalone (compose.prod.yml + scripts/deploy.sh,
# docs/runbook.md), a rollback por tag e a `APP_IMAGE`/`OPS_IMAGE` caso o Coolify
# passe a puxar imagem pronta em vez de buildar. Não há deploy automático.
#
# Tags: `sha-<commit curto>` e `latest` SÓ a partir da main (código que passou
# por PR); dispatch de outra branch publica só `branch-<commit curto>`, que o
# deploy.sh recusa.
# Actions fixadas por SHA de commit (versão no comentário); atualize os dois juntos.
name: imagens

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada por padrão; cada job pede só o que usa.
permissions: {}

# Dois pushes seguidos na main: o segundo espera o primeiro; `latest` nunca regride.
concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/gabriel-marques-tech
  # Arquitetura da VPS. Instância Graviton (t4g/m7g/…): defina a variável de
  # repositório IMAGE_PLATFORMS=linux/arm64 (build via QEMU, bem mais lento).
  PLATAFORMAS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # histórico para comparar as migrations com o push anterior

      # Expand/contract: migration nova destrutiva sem `-- destrutiva-ok:` barra o
      # build. Nos PRs o mesmo check roda em migrations.yml.
      - name: Migrations destrutivas
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.before }}
        run: scripts/checar-migrations.sh "$BASE"

      - name: QEMU (só para arm64)
        if: contains(env.PLATAFORMAS, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags do app
        id: meta-app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-app
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=branch-,format=short,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # A tag imutável (a que o deploy.sh/rollback usa), conferida contra a lista
      # que o metadata-action gerou (e que o build abaixo publica).
      - name: Tag imutável
        id: tag
        if: github.ref == 'refs/heads/main'
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          IMAGEM: ${{ env.REGISTRO }}/ij-crm-app
        run: |
          tag="sha-${GITHUB_SHA::7}"
          grep -qxF "$IMAGEM:$tag" <<<"$TAGS_APP" \
            || { echo "::error::$IMAGEM:$tag não está nas tags geradas: $TAGS_APP"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tags do ops
        id: meta-ops
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-ops
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=branch-,format=short,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Mesmo builder nos dois passos: o estágio `deps` (pnpm install) do app é
      # reaproveitado pelo ops. Cache entre execuções no cache do GitHub Actions.
      - name: Build + push app (runtime)
        id: push-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build + push ops (migrate)
        id: push-ops
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ops
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-ops.outputs.tags }}
          labels: ${{ steps.meta-ops.outputs.labels }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=ops
          cache-to: type=gha,scope=ops,mode=max

      - name: Resumo
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          TAGS_OPS: ${{ steps.meta-ops.outputs.tags }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST_APP: ${{ steps.push-app.outputs.digest }}
          DIGEST_OPS: ${{ steps.push-ops.outputs.digest }}
        run: |
          {
            echo "### Imagens publicadas"
            echo
            echo '```'
            echo "$TAGS_APP"
            echo "$TAGS_OPS"
            echo "app@$DIGEST_APP"
            echo "ops@$DIGEST_OPS"
            echo '```'
            echo
            if [[ -z "$TAG" ]]; then
              echo "Build fora da main: tags \`branch-…\`, que o deploy.sh não aceita."
            else
              echo "Produção (Coolify) não usa esta imagem: deploy é o Redeploy no painel (docs/coolify.md)."
              echo "Standalone: \`scripts/deploy.sh $TAG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

