# `next build` em todo PR para a main: o mesmo build que o Coolify roda no
# estágio `build` do Dockerfile (`prisma generate && pnpm build`), mas no runner
# do GitHub. O `next build` faz typecheck de todo o projeto (inclusive testes):
# um erro de tipo que passa no `tsc` de alguém quebra aqui, não no deploy.
#
# Sem env de app de propósito: o estágio `build` do Dockerfile também roda sem
# nenhuma (o env é lido sob demanda, nunca no import; `instrumentation.ts` pula
# o banco em `phase-production-build`). Se um dia o build passar a exigir uma
# variável, ele quebra aqui antes de quebrar no Coolify.
# Versões de node/pnpm iguais às do Dockerfile (node 22; pnpm do `packageManager`).
# Actions fixadas por SHA de commit (versão no comentário).
name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Push novo no mesmo PR cancela o build anterior.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Sem `version`: lê o `packageManager` do package.json (pnpm@12.6.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: ./node_modules/.bin/prisma generate

      - name: next build
        run: pnpm build

      # GAB-84: a extração de texto de PDF roda num processo filho
      # (src/lib/anexos/pdf-filho.mjs + unpdf), que só entra no standalone por
      # `outputFileTracingIncludes`. Roda o filho de uma CÓPIA do standalone fora
      # do repo (senão o Node acharia o `unpdf` do node_modules da raiz e o teste
      # passaria mesmo sem o tracing), como o `node` faz no container.
      - name: Extração de PDF no standalone
        run: |
          ./node_modules/.bin/tsx --eval 'import { pdfDeTexto } from "./src/test/fixtures/anexos.ts"; process.stdout.write(pdfDeTexto(["Proposta do CI"]));' > "$RUNNER_TEMP/ci.pdf"
          cp -a .next/standalone "$RUNNER_TEMP/standalone"
          cd "$RUNNER_TEMP/standalone"
          node src/lib/anexos/pdf-filho.mjs < "$RUNNER_TEMP/ci.pdf" | tee "$RUNNER_TEMP/saida.json"
          grep -q '"paginas":\["Proposta do CI"\]' "$RUNNER_TEMP/saida.json"

      # GAB-89/GAB-100: o PDF da proposta lê as fontes e as imagens do modelo do disco
      # (src/lib/pdf/fontes.ts): elas só entram no standalone por `outputFileTracingIncludes`.
      - name: Fontes e imagens do PDF no standalone
        run: |
          for f in Arimo-Regular Arimo-Bold Arimo-Italic Arimo-BoldItalic Poppins-Regular Poppins-Bold; do
            test -s ".next/standalone/src/lib/pdf/fontes/$f.ttf" || { echo "faltou $f.ttf no standalone"; exit 1; }
          done
          for f in capa faixa rodape; do
            test -s ".next/standalone/src/lib/pdf/imagens/$f.png" || { echo "faltou $f.png no standalone"; exit 1; }
          done
